<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>Iron — hráči</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="app-body">
<div class="titlebar">
  <div class="tb-left">
    <span class="tb-dot"></span>
    <span class="tb-title">Iron Anticheat</span>
  </div>
  <div class="tb-right">
    <button class="tb-btn" data-action="min">–</button>
    <button class="tb-btn" data-action="max">□</button>
    <button class="tb-btn close" data-action="close">×</button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="side-brand"><span class="dot"></span><span>IRON</span></div>
    <nav class="side-nav">
      <a href="index.html"><span class="ico">▦</span> přehled</a>
      <a href="players.html" class="active"><span class="ico">◉</span> hráči</a>
      <a href="events.html"><span class="ico">≡</span> eventy</a>
      <a href="settings.html"><span class="ico">⚙</span> nastavení</a>
    </nav>
    <div class="side-foot">
      <div class="side-user" id="side-user">—</div>
      <a href="#" id="logout" class="side-logout">odhlásit</a>
    </div>
  </aside>

  <main class="content">
    <div class="content-head">
      <h1>Hráči</h1>
      <span class="pill" id="count">0</span>
    </div>
    <section class="panel">
      <table class="tbl" id="tbl">
        <thead><tr><th>ID</th><th>Jméno</th><th>License</th><th>Akce</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
</div>

<script src="auth.js"></script>
<script src="app.js"></script>
<script src="titlebar.js"></script>
<script>
(async () => {
  if (!await IronAuth.requireLogin()) return;
  initFrame('players.html', 'Hráči');

  async function tick() {
    const { players } = await IronAPI.players();
    const tb = document.querySelector('#tbl tbody');
    tb.innerHTML = '';
    for (const p of players) {
      const lic = (p.identifiers || []).find(i => i.startsWith('license:')) || '';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(p.id)}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(lic.slice(0, 24))}${lic.length > 24 ? '…' : ''}</td>
        <td>
          <button data-act="kick" data-id="${esc(p.id)}" class="ghost">kick</button>
          <button data-act="ban" data-id="${esc(p.id)}" class="danger">ban</button>
          <button data-act="message" data-id="${esc(p.id)}" class="ghost">msg</button>
        </td>`;
      tb.appendChild(tr);
    }
    document.getElementById('count').textContent = players.length;
    tb.querySelectorAll('button').forEach(b => b.onclick = async () => {
      const reason = prompt('důvod:') || '';
      await IronAPI.action(b.dataset.act, parseInt(b.dataset.id, 10), reason);
    });
  }

  tick();
  setInterval(tick, 4000);
})();
</script>
</body>
</html>
