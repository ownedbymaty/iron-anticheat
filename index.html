<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>Iron — přehled</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="app-body">
<div class="titlebar">
  <div class="tb-left">
    <span class="tb-dot"></span>
    <span class="tb-title">Iron Anticheat</span>
  </div>
  <div class="tb-right">
    <button class="tb-btn" data-action="min">–</button>
    <button class="tb-btn" data-action="max">□</button>
    <button class="tb-btn close" data-action="close">×</button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="side-brand">
      <span class="dot"></span>
      <span>IRON</span>
    </div>
    <nav class="side-nav">
      <a href="index.html" class="active"><span class="ico">▦</span> přehled</a>
      <a href="players.html"><span class="ico">◉</span> hráči</a>
      <a href="events.html"><span class="ico">≡</span> eventy</a>
      <a href="settings.html"><span class="ico">⚙</span> nastavení</a>
    </nav>
    <div class="side-foot">
      <div class="side-user" id="side-user">—</div>
      <a href="#" id="logout" class="side-logout">odhlásit</a>
    </div>
  </aside>

  <main class="content">
    <div class="content-head">
      <h1>Přehled</h1>
      <span class="pill" id="live-status">live</span>
    </div>

    <div class="content-grid">
      <section class="panel players">
        <h2>Hráči <span id="player-count" class="pill">0</span></h2>
        <ul id="player-list"></ul>
      </section>

      <section class="panel feed">
        <h2>Posledních 20 eventů</h2>
        <ul id="event-feed"></ul>
      </section>

      <section class="panel console">
        <h2>Rychlá akce</h2>
        <div class="row"><input id="act-id" type="number" placeholder="id hráče" /></div>
        <div class="row"><input id="act-reason" placeholder="důvod" /></div>
        <div class="row">
          <button id="btn-kick">kick</button>
          <button id="btn-ban" class="danger">ban</button>
          <button id="btn-msg" class="ghost">zpráva</button>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="auth.js"></script>
<script src="app.js"></script>
<script src="titlebar.js"></script>
<script>
(async () => {
  if (!await IronAuth.requireLogin()) return;
  initFrame('index.html', 'Přehled');

  let cursor = Date.now() - 60000;
  const feed = document.getElementById('event-feed');

  function push(e) {
    const li = document.createElement('li');
    li.className = e.level || 'warn';
    li.innerHTML = `<span class="ts">${fmtTime(e.received || e.time)}</span>`
      + `${esc(e.category)} | ${esc(e.player || '-')} | ${esc(e.reason)}`;
    feed.prepend(li);
    while (feed.children.length > 20) feed.lastChild.remove();
  }

  async function tick() {
    const { events, cursor: next } = await IronAPI.feed(cursor);
    events.forEach(push);
    if (next) cursor = next;
  }
  async function playersTick() {
    const { players } = await IronAPI.players();
    const ul = document.getElementById('player-list');
    ul.innerHTML = '';
    players.forEach(p => {
      const li = document.createElement('li');
      li.textContent = `[${p.id}] ${p.name}`;
      ul.appendChild(li);
    });
    document.getElementById('player-count').textContent = players.length;
  }

  document.getElementById('btn-kick').onclick = () =>
    IronAPI.action('kick', parseInt(document.getElementById('act-id').value, 10),
      document.getElementById('act-reason').value.trim());
  document.getElementById('btn-ban').onclick = () =>
    IronAPI.action('ban', parseInt(document.getElementById('act-id').value, 10),
      document.getElementById('act-reason').value.trim());
  document.getElementById('btn-msg').onclick = () =>
    IronAPI.action('message', parseInt(document.getElementById('act-id').value, 10),
      document.getElementById('act-reason').value.trim());

  tick(); playersTick();
  setInterval(tick, 3000);
  setInterval(playersTick, 5000);
})();
</script>
</body>
</html>
